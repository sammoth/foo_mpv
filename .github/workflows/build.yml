name: build-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.platform }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win32
            triplet: x86-mpv
          - platform: x64
            triplet: x64-mpv

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Configure vcpkg cache
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Install dependencies
        shell: pwsh
        run: .\scripts\install-dependencies.ps1 -Triplet '${{ matrix.triplet }}'

      - name: Set development version
        shell: pwsh
        run: |
          $revision = git rev-list --count HEAD
          $versionDefinition = '#define VERSION_NO "{0}"' -f "99.99.99 alpha $revision"
          (Get-Content .\src\main.cpp) `
            -replace '#define VERSION_NO.*$', $versionDefinition |
            Set-Content .\src\main.cpp

      - name: Build Debug
        run: >-
          msbuild .\src\foo_mpv.sln /m /t:Build
          /p:Configuration=Debug /p:Platform=${{ matrix.platform }} /v:minimal

      - name: Build Release
        run: >-
          msbuild .\src\foo_mpv.sln /m /t:Build
          /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: foo_mpv-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src/build/${{ matrix.platform }}/Debug/foo_mpv/foo_mpv.dll
            src/build/${{ matrix.platform }}/Debug/foo_mpv/foo_mpv.pdb
            src/build/${{ matrix.platform }}/Release/foo_mpv/foo_mpv.dll
            src/build/${{ matrix.platform }}/Release/foo_mpv/foo_mpv.pdb
